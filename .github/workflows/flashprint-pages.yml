name: flashprint-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Enables Pages on first run, so the repository needs no manual
      # setup beyond the pages permission above.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build prose package
        run: pnpm --filter=@milkdown/prose run build

      - name: Build FlashPrint
        run: pnpm --filter=@milkdown/flashprint run build
        env:
          FLASHPRINT_BASE: /milkdown-flashprint-/
          FLASHPRINT_OUT_DIR: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flashprint/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
